<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .card-container {
            width: 100%;
            height: calc(100% - 80px); /* Leave space for button */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        #business-card {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            position: absolute;
            top: 50%;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #ff6b6b;
            text-align: center;
            display: none;
            position: absolute;
            font-size: 1.1rem;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        /* Download Button Styles */
        .download-btn {
            display: none; /* Hidden until card loads */
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            margin-bottom: 20px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: slideUp 0.5s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="loader" id="loader"></div>
    <div class="error-msg" id="error-msg">Card not found.<br>Please check the link.</div>
    
    <div class="card-container">
        <img id="business-card" alt="Business Card">
    </div>

    <a id="download-btn" class="download-btn" download>Save Card to Device</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');
        const imgElement = document.getElementById('business-card');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');
        const downloadBtn = document.getElementById('download-btn');

        async function forceDownload(url, filename) {
            try {
                // Fetch the image as a blob to force download instead of opening in browser
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Cleanup
                setTimeout(() => window.URL.revokeObjectURL(blobUrl), 100);
            } catch (error) {
                console.error("Download failed:", error);
                // Fallback for older browsers
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function onImageLoaded(imgUrl, extension) {
            loader.style.display = 'none';
            imgElement.style.display = 'block';
            
            const filename = cardId + '_Business_Card.' + extension;

            // Setup the manual download button
            downloadBtn.style.display = 'block';
            downloadBtn.href = 'javascript:void(0)';
            downloadBtn.onclick = function(e) {
                e.preventDefault();
                forceDownload(imgUrl, filename);
            };

            // Try to auto-download after a short delay so the user sees the card first
            setTimeout(() => {
                forceDownload(imgUrl, filename);
            }, 1000);
        }

        if (cardId) {
            const jpgUrl = 'cards/' + cardId + '.jpg';
            const pngUrl = 'cards/' + cardId + '.png';

            imgElement.src = jpgUrl;
            
            imgElement.onload = function() {
                onImageLoaded(jpgUrl, 'jpg');
                // Reset onload to prevent multiple triggers if src changes
                imgElement.onload = null; 
            };

            let attempts = 0;
            imgElement.onerror = function() {
                if (attempts === 0) {
                    attempts++;
                    imgElement.src = pngUrl;
                    imgElement.onload = function() {
                        onImageLoaded(pngUrl, 'png');
                        imgElement.onload = null;
                    }
                } else {
                    loader.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            };
        } else {
            loader.style.display = 'none';
            errorMsg.innerHTML = "Welcome!<br>Please provide a valid card ID in the link.";
            errorMsg.style.display = 'block';
        }
    </script>

</body>
</html>
