<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Dark premium background */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .card-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        #business-card {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
            display: none; /* Hidden until loaded */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            position: absolute;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #ff6b6b;
            text-align: center;
            display: none;
            position: absolute;
            font-size: 1.1rem;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="loader" id="loader"></div>
    <div class="error-msg" id="error-msg">Card not found.<br>Please check the link.</div>
    
    <div class="card-container">
        <img id="business-card" alt="Business Card">
    </div>

    <script>
        // Get the 'id' parameter from the URL (e.g., ?id=nimal)
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');
        const imgElement = document.getElementById('business-card');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');

        if (cardId) {
            // We assume images are saved as .jpg by default
            imgElement.src = 'cards/' + cardId + '.jpg';
            
            imgElement.onload = function() {
                loader.style.display = 'none';
                imgElement.style.display = 'block';
            };

            // If .jpg fails, try .png
            let attempts = 0;
            imgElement.onerror = function() {
                if (attempts === 0) {
                    attempts++;
                    imgElement.src = 'cards/' + cardId + '.png';
                } else {
                    loader.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            };
        } else {
            loader.style.display = 'none';
            errorMsg.innerHTML = "Welcome!<br>Please provide a valid card ID in the link.";
            errorMsg.style.display = 'block';
        }
    </script>

</body>
</html>
